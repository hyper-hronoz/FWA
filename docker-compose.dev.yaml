services:
  db:
    image: mysql:9.2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init:/docker-entrypoint-initdb.d

  service-auth:
    image: node:20
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend/services/service-auth:/usr/src/app
      - service_auth_node_modules:/usr/src/app/node_modules

  service-girls:
    image: node:20
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "3002:3002"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend/services/service-girls:/usr/src/app
      - ./backend/static:/app/static
      - service_girls_node_modules:/usr/src/app/node_modules

  service-users:
    image: node:20
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "3103:3003"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend/services/service-users:/usr/src/app
      - service_users_node_modules:/usr/src/app/node_modules

  service-gateway:
    image: node:20
    working_dir: /usr/src/app
    command: >
      sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - service-auth
      - service-users
      - service-girls
    volumes:
      - ./backend/service-gateway:/usr/src/app
      - ./backend/static:/app/static
      - service_gateway_node_modules:/usr/src/app/node_modules

  frontend-host:
    image: node:20
    working_dir: /workspace
    command: >
      sh -c "npm install && PORT=3003 REMOTE_MAIN_URL=http://localhost:3004 REMOTE_ADMIN_URL=http://localhost:3005 npm run start -w @fwa/host -- --host 0.0.0.0"
    ports:
      - "3003:3003"
    depends_on:
      - service-gateway
    volumes:
      - ./:/workspace
      - frontend_host_node_modules:/workspace/node_modules

  frontend-remote-main:
    image: node:20
    working_dir: /workspace
    command: >
      sh -c "npm install && PORT=3004 npm run start -w @fwa/remote-main -- --host 0.0.0.0"
    ports:
      - "3004:3004"
    depends_on:
      - service-gateway
    volumes:
      - ./:/workspace
      - frontend_remote_main_node_modules:/workspace/node_modules

  frontend-remote-admin:
    image: node:20
    working_dir: /workspace
    command: >
      sh -c "npm install && PORT=3005 npm run start -w @fwa/remote-admin -- --host 0.0.0.0"
    ports:
      - "3005:3005"
    depends_on:
      - service-gateway
    volumes:
      - ./:/workspace
      - frontend_remote_admin_node_modules:/workspace/node_modules

volumes:
  mysql_data:
  frontend_host_node_modules:
  frontend_remote_main_node_modules:
  frontend_remote_admin_node_modules:
  service_auth_node_modules:
  service_girls_node_modules:
  service_users_node_modules:
  service_gateway_node_modules:
