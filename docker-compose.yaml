services:
  db:
    image: mysql:9.2
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql/init:/docker-entrypoint-initdb.d


  service-auth:
    build: ./backend/services/service-auth
    ports:
      - "3001:3001"
    depends_on:
      - db
    env_file:
      - .env


  service-girls:
    build: ./backend/services/service-girls
    ports:
      - "3002:3002"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - db
    env_file:
      - .env


  service-users:
    build: ./backend/services/service-users
    ports:
      - "3003:3003"
    depends_on:
      - db
    env_file:
      - .env


  service-gateway:
    build: ./backend/service-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./backend/static:/app/static
    depends_on:
      - service-auth
      - service-users
      - service-girls

  # Базовый фронт (ЛР до стейт-менеджеров) — http://localhost:5000
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: fwa_frontend_classic
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/frontend:/var/log/nginx
      - ./backend/static/videos:/usr/share/nginx/html/videos
    depends_on:
      - service-gateway

  # Redux Toolkit + RTK Query — http://localhost:5001
  frontend-rtk:
    build:
      context: .
      dockerfile: frontend-rtk/Dockerfile
    container_name: fwa_frontend_rtk
    ports:
      - "5001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/frontend-rtk:/var/log/nginx
      - ./backend/static/videos:/usr/share/nginx/html/videos
    depends_on:
      - service-gateway

  # MobX — http://localhost:5002
  frontend-mobx:
    build:
      context: .
      dockerfile: frontend-mobx/Dockerfile
    container_name: fwa_frontend_mobx
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./logs/frontend-mobx:/var/log/nginx
      - ./backend/static/videos:/usr/share/nginx/html/videos
    depends_on:
      - service-gateway

volumes:
  mysql_data:
